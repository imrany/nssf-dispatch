name: Release Binaries & Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish release assets to GitHub Releases'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="$(echo "${{ github.event.inputs.version }}" | tr -d '[:space:]')"
            RAW_TAG="${RAW_TAG:-v1.0.0}"
            TAG="v${RAW_TAG#v}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install cross-packaging tools (mingw-w64, zip, msitools, wixl, osslsigncode, appstream)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip msitools wixl osslsigncode appstream
          wixl --version

      - name: Build frontend & cross-platform Go packages
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          REQUIRE_MSI: '1'
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: bash go/build.sh

      - name: Verify Linux binary, .deb, AppStream metainfo, and Windows .msi metadata
        run: |
          ls -lh ./go/release/
          test -s ./go/release/NSSF-Statement-Dispatch-windows-amd64.msi
          ./go/release/nssf-statement-dispatch-linux-amd64 --version
          appstreamcli validate --no-net ./go/packaging/linux/ke.co.nssf.statementdispatch.metainfo.xml
          dpkg-deb -I ./go/release/NSSF-Statement-Dispatch-linux-amd64.deb
          dpkg-deb -c ./go/release/NSSF-Statement-Dispatch-linux-amd64.deb | grep -E 'copyright|metainfo|LICENSE'
          msiinfo suminfo ./go/release/NSSF-Statement-Dispatch-windows-amd64.msi
          if [ -n "${{ secrets.WINDOWS_CERT_PFX_BASE64 }}" ]; then
            osslsigncode verify ./go/release/NSSF-Statement-Dispatch-windows-amd64.exe
            osslsigncode verify ./go/release/NSSF-Statement-Dispatch-windows-amd64.msi
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NSSF Digital Statement Dispatcher ${{ steps.meta.outputs.tag }}
          body: |
            ### Desktop Installers
            - **Windows Installer (Recommended):** `NSSF-Statement-Dispatch-windows-amd64.msi` (or portable `NSSF-Statement-Dispatch-windows-amd64.zip`)
            - **Ubuntu / Debian:** `NSSF-Statement-Dispatch-linux-amd64.deb` / `NSSF-Statement-Dispatch-linux-arm64.deb`
            - **macOS:** `NSSF-Statement-Dispatch-macos-arm64.app.tar.gz` / `NSSF-Statement-Dispatch-macos-amd64.app.tar.gz`

            *(Expand **Assets** below if GitHub collapses the full list of 14 release files.)*
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: go/release/*

      - name: Upload workflow artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nssf-statement-dispatch-${{ steps.meta.outputs.version }}
          path: go/release/*
